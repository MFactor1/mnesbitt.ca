<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src/assets/MattIco.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="theme-color" content="#000000">
    <title>Matthew Nesbitt</title>
    <script>
      // Apply saved theme before first paint (default: dark) so light-mode
      // users never see a dark flash on load.
      try {
        const t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'light' ? '#dbcbcc' : '#1a1722');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
